name: Build Flux AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in repository root!"
            ls -la
            exit 1
          fi
          echo "Found archive: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project
          if [ ! -f project/package.json ]; then
            SUBDIR=$(find project -maxdepth 2 -name "package.json" -printf "%h\n" | head -n 1)
            cp -r "$SUBDIR"/* project/
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set relative base path & build Vite bundle
        working-directory: project
        run: |
          sed -i "s|defineConfig({|defineConfig({ base: './',|g" vite.config.ts
          npm install --legacy-peer-deps
          npm run build

      - name: Configure Capacitor Android & sync
        working-directory: project
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          if [ -f capacitor.config.ts ]; then
            APP_ID=$(grep -oE "appId:\s*['\"][^'\"]+['\"]" capacitor.config.ts | sed -E "s/appId:\s*['\"]([^'\"]+)['\"]/\1/")
            APP_NAME=$(grep -oE "appName:\s*['\"][^'\"]+['\"]" capacitor.config.ts | sed -E "s/appName:\s*['\"]([^'\"]+)['\"]/\1/")
            rm -f capacitor.config.ts
          fi
          APP_ID=${APP_ID:-"com.superduper.fluxai"}
          APP_NAME=${APP_NAME:-"Flux AI"}
          cat << EOF > capacitor.config.json
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin duplicate class conflict
        working-directory: project/android
        run: |
          cat << 'EOF' >> app/build.gradle

          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          EOF

      - name: Build Debug APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flux-AI-Android-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
